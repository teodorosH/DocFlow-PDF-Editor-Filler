<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- גרדיאנט רקע כחול מודרני -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="50%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#4364F7" />
    </linearGradient>

    <!-- גרדיאנט עט עריכה בולט -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="100%" stop-color="#DD2476" />
    </linearGradient>

    <!-- צללית רכה לעומק -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- רקע אייקון עגול-פינות (תקן App Store & Google Play) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- דף ה-PDF -->
  <g filter="url(#shadow)">
    <!-- גוף המסמך -->
    <path d="M140 100 H300 L360 160 V390 C360 401 351 410 340 410 H140 C129 410 120 401 120 390 V120 C120 109 129 100 140 100 Z" fill="#FFFFFF" />
    <!-- פינה מקופלת -->
    <path d="M300 100 L360 160 H310 C304.5 160 300 155.5 300 150 V100 Z" fill="#CBD5E1" />
  </g>

  <!-- קווי מילוי ומרקור בתוך המסמך -->
  <g filter="url(#shadow)">
    <!-- קו טקסט 1 -->
    <rect x="155" y="180" width="120" height="14" rx="7" fill="#0052D4" opacity="0.85" />
    <!-- קו מילוי 2 -->
    <rect x="155" y="215" width="160" height="14" rx="7" fill="#94A3B8" />
    <!-- קו מרקר צהוב (Highlight) -->
    <rect x="155" y="250" width="110" height="16" rx="4" fill="#FFD700" opacity="0.75" />
    <!-- קו מילוי 3 -->
    <rect x="155" y="288" width="140" height="14" rx="7" fill="#94A3B8" />
  </g>

  <!-- עט העריכה (DocFlow Edit & Fill Pen) -->
  <g filter="url(#shadow)" transform="translate(20, -10)">
    <!-- גוף העט -->
    <path d="M310 270 L380 200 C386 194 396 194 402 200 L412 210 C418 216 418 226 412 232 L342 302 L300 312 L310 270 Z" fill="url(#accentGrad)" />
    <!-- חוד העט -->
    <path d="M300 312 L315 307 L305 297 Z" fill="#FFFFFF" />
  </g>
</svg>
